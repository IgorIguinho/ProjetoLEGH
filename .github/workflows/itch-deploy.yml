name: Deploy to Itch.io

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

env:
  ITCH_USERNAME: ${{ vars.ITCH_USERNAME }}
  ITCH_GAME_ID: ${{ vars.ITCH_GAME_ID }}

jobs:
  build-and-deploy:
    name: Build Unity and Deploy to Itch.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Unity License File
        run: |
          mkdir -p ~/.local/share/unity3d/Unity/
          echo "${{ secrets.UNITY_LICENSE }}" > ~/.local/share/unity3d/Unity/Unity_lic.ulf
          # Also create in workspace for Docker container access
          mkdir -p .github/unity-license
          echo "${{ secrets.UNITY_LICENSE }}" > .github/unity-license/Unity_lic.ulf

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          projectPath: .
          buildName: WebGL
          buildsPath: build/webgl
          unityVersion: 2022.3.46f1

      - name: Deploy to Itch.io
        uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./build/webgl/WebGL
          itchUsername: ${{ env.ITCH_USERNAME }}
          itchGameId: ${{ env.ITCH_GAME_ID }}
          buildChannel: webgl
